name: Core verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install bundled, pinned dependencies
        run: python -m pip install --no-index --find-links runtime -r requirements.txt
      - name: Run unit and mathematical regression tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test
        run: python -m engine verify examples/z-complete.json --require-correct
      - name: Static JavaScript syntax
        run: |
          node --check app.js
          node --check landing.js
          node --check worker.js
          node --check local-ai/wwwroot/tutor.js
  local-tutor:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build local C# tutor
        run: dotnet build local-ai/SignalProof.Tutor.csproj --configuration Release
      - name: Check tutor protocol, prompts and validation (no API credentials)
        run: dotnet run --project local-ai/tests/SignalProof.Tutor.Checks.csproj --configuration Release
